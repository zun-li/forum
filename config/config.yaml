snowflake:
  # 多实例必须使用不同的节点编号（0–1023）。
  node_id: 1

server:
  addr: "127.0.0.1:8080"

mysql:
  addr: "127.0.0.1:3306"
  user: "root"
  password: ""
  database: "forum"
  max_open_conns: 10
  max_idle_conns: 5

redis:
  addr: "127.0.0.1:6379"
  db: 0

jwt:
  # 使用 JWT_SECRET 环境变量传入至少 32 字节的随机密钥。
  secret: ""
  issuer: "forum"
  audience: "forum-api"
  access_ttl: "30m"
  renewal_window: "5m"
  max_lifetime: "168h"
